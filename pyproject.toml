[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "croods-scope-guard"
version = "0.1.0"
description = "Audit Croods authorization scopes and generate evidence-based reports"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
croods-scope-audit = "croods_scope_guard.cli:main"

[tool.setuptools.packages.find]
include = ["croods_scope_guard*"]
